name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Prettier 💾
        # versions are pinned in package.json so CI and local formatting agree
        run: npm install --no-package-lock
      - name: Prettier Check 🔎
        id: prettier
        run: npx prettier . --check
      - name: Create diff 📝
        # https://docs.github.com/en/actions/learn-github-actions/expressions#failure
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        run: |
          npx prettier . --write
          git diff -- . ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt
      - name: Upload html diff ⬆️
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
