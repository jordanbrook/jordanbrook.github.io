name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "**.html"
      - "**.liquid"
      - "**/*.md"
      - ".github/workflows/broken-links.yml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "**.html"
      - "**.liquid"
      - "**/*.md"
      - ".github/workflows/broken-links.yml"
  workflow_dispatch:

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Checks external links written in the site's own content.
          # Liquid templates and the parked demo pages in _ignore/ contain unrendered
          # {{ ... }} links, so they are checked on the built site instead (broken-links-site.yml).
          args: >-
            --user-agent 'curl/7.54'
            --exclude-path _pages/404.md
            --exclude-path _ignore
            --exclude-path _site
            --exclude-path node_modules
            --exclude-loopback
            --no-progress
            './**/*.md'
